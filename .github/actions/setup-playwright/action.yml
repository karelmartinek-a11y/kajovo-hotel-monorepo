name: Prepared Playwright runtime
description: Verify that the installed Playwright package matches the browser container without downloading OS dependencies.
runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-node
    - name: Verify the prepared browser version
      shell: bash
      run: |
        set -euo pipefail
        test "$PLAYWRIGHT_BROWSERS_PATH" = /ms-playwright
        test -d "$PLAYWRIGHT_BROWSERS_PATH"
        node <<'NODE'
        for (const path of ['apps/kajovo-hotel-web', 'apps/kajovo-hotel-admin', 'packages/voice-core']) {
          const installed = require(`./${path}/node_modules/@playwright/test/package.json`).version;
          if (installed !== '1.58.2') throw new Error(`${path}: Playwright ${installed} does not match v1.58.2-noble`);
        }
        NODE
