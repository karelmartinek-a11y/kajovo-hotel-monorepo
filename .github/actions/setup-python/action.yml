name: Constrained Python dependencies
description: Reuse the API project manifest and central constraints in every Python validation environment.
inputs:
  profile:
    description: Dependency set (dev, runtime, lint or portable)
    default: dev
runs:
  using: composite
  steps:
    - name: Restore the hosted Python cache path inside job containers
      shell: bash
      run: |
        set -euo pipefail
        # Cached pip scripts retain /opt/hostedtoolcache in their shebang;
        # GitHub mounts that directory at /__t inside container jobs.
        if [ -d /__t ] && [ ! -e /opt/hostedtoolcache ]; then
          mkdir -p /opt
          ln -s /__t /opt/hostedtoolcache
        fi
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: |
          requirements/*.txt
          apps/kajovo-hotel-api/pyproject.toml
          packages/voice-core-server/pyproject.toml
    - name: Install the required Python profile
      shell: bash
      env:
        DEPENDENCY_PROFILE: ${{ inputs.profile }}
      run: |
        set -euo pipefail
        case "$DEPENDENCY_PROFILE" in
          lint) python -m pip install -c requirements/constraints.txt ruff pytest pyyaml ;;
          portable) python -m pip install -c requirements/constraints.txt ./packages/voice-core-server pytest ;;
          runtime) python -m pip install -c requirements/constraints.txt ./packages/voice-core-server -e ./apps/kajovo-hotel-api ;;
          dev) python -m pip install -c requirements/constraints.txt ./packages/voice-core-server -e './apps/kajovo-hotel-api[dev]' ;;
          *) echo 'Unknown Python dependency profile' >&2; exit 1 ;;
        esac
