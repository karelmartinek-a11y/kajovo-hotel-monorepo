name: Android Production Acceptance - Kajovo Hotel

on:
  workflow_dispatch:
    inputs:
      confirm_mutations:
        description: 'Explicitly authorize temporary room 203 change/restore and one labeled admin chat message'
        required: true
        type: choice
        options:
          - no
          - room-203-and-one-admin-chat
        default: no

permissions:
  contents: read

concurrency:
  group: android-production-acceptance
  cancel-in-progress: false

jobs:
  production-acceptance:
    if: github.ref == 'refs/heads/main' && inputs.confirm_mutations == 'room-203-and-one-admin-chat'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      VERIFY_BASE_URL: https://hotel.hcasc.cz
      VERIFY_CONFIRM_MUTATIONS: ${{ inputs.confirm_mutations }}
      VERIFY_ADMIN_EMAIL: ${{ secrets.HOTEL_ADMIN_EMAIL != '' && secrets.HOTEL_ADMIN_EMAIL || vars.HOTEL_ADMIN_EMAIL }}
      VERIFY_ADMIN_PASSWORD: ${{ secrets.HOTEL_ADMIN_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Validate script syntax
        run: |
          node --check scripts/verify_android_employee_production.mjs
          node --check scripts/cleanup_android_production_acceptance.mjs
          node --test scripts/android_production_acceptance_policy.test.mjs

      - name: Validate protected admin credentials
        run: test -n "$VERIFY_ADMIN_EMAIL" && test -n "$VERIFY_ADMIN_PASSWORD"

      - name: Verify room 203 restoration and administrator chat
        id: production_acceptance
        run: node scripts/verify_android_employee_production.mjs

      - name: Restore room status and remove temporary employee
        if: always()
        env:
          VERIFY_BASE_URL: https://hotel.hcasc.cz
          VERIFY_ADMIN_EMAIL: ${{ secrets.HOTEL_ADMIN_EMAIL != '' && secrets.HOTEL_ADMIN_EMAIL || vars.HOTEL_ADMIN_EMAIL }}
          VERIFY_ADMIN_PASSWORD: ${{ secrets.HOTEL_ADMIN_PASSWORD }}
          VERIFY_ROOM_RESTORE_PLAN: ${{ steps.production_acceptance.outputs.room_restore_plan }}
          VERIFY_PROBE_UPDATE_VERIFIED: ${{ steps.production_acceptance.outputs.probe_update_verified }}
          VERIFY_TEST_EMPLOYEE_ID: ${{ steps.production_acceptance.outputs.test_employee_id }}
        run: node scripts/cleanup_android_production_acceptance.mjs
