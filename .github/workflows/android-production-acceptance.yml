name: Android Production Acceptance - Kajovo Hotel

on:
  workflow_dispatch:
    inputs:
      confirm_mutations:
        description: 'Explicitly authorize temporary room 203 change/restore and one labeled admin chat message'
        required: true
        type: choice
        options:
          - no
          - room-203-and-one-admin-chat
        default: no

permissions:
  contents: read

concurrency:
  group: android-production-acceptance
  cancel-in-progress: false

jobs:
  production-acceptance:
    if: inputs.confirm_mutations == 'room-203-and-one-admin-chat'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERIFY_BASE_URL: https://hotel.hcasc.cz
      VERIFY_CONFIRM_MUTATIONS: ${{ inputs.confirm_mutations }}
      VERIFY_ADMIN_EMAIL: ${{ secrets.HOTEL_ADMIN_EMAIL != '' && secrets.HOTEL_ADMIN_EMAIL || vars.HOTEL_ADMIN_EMAIL }}
      VERIFY_ADMIN_PASSWORD: ${{ secrets.HOTEL_ADMIN_PASSWORD != '' && secrets.HOTEL_ADMIN_PASSWORD || vars.HOTEL_ADMIN_PASSWORD }}
      HOTEL_ADMIN_EMAIL: ${{ secrets.HOTEL_ADMIN_EMAIL != '' && secrets.HOTEL_ADMIN_EMAIL || vars.HOTEL_ADMIN_EMAIL }}
      HOTEL_ADMIN_PASSWORD: ${{ secrets.HOTEL_ADMIN_PASSWORD != '' && secrets.HOTEL_ADMIN_PASSWORD || vars.HOTEL_ADMIN_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Validate script syntax
        run: node --check scripts/verify_android_employee_production.mjs

      - name: Validate admin credential environment
        run: python3 scripts/check_admin_credentials_env.py

      - name: Verify room 203 restoration and administrator chat
        run: node scripts/verify_android_employee_production.mjs
