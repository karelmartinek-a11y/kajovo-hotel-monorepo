name: Android Signed Artifact - Kajovo Hotel

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Candidate version code (publish manifest and APK together after verification)'
        required: false
        type: string
      version_name:
        description: 'Candidate version name'
        required: false
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  signed-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Materialize production signing key
        env:
          SIGNING_KEY_B64: ${{ secrets.KAJOVO_UPLOAD_STORE_FILE_B64 }}
        run: |
          test -n "$SIGNING_KEY_B64"
          printf '%s' "$SIGNING_KEY_B64" | base64 --decode > "$RUNNER_TEMP/kajovo-upload.keystore"
          chmod 600 "$RUNNER_TEMP/kajovo-upload.keystore"

      - name: Prepare candidate version
        env:
          CANDIDATE_CODE: ${{ inputs.version_code }}
          CANDIDATE_NAME: ${{ inputs.version_name }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          code, name = os.environ['CANDIDATE_CODE'], os.environ['CANDIDATE_NAME']
          if bool(code) != bool(name):
              raise SystemExit('Supply both candidate version fields or neither.')
          if code:
              path = Path('release/android-release.json')
              manifest = json.loads(path.read_text())
              if not code.isdecimal() or int(code) <= manifest['version_code'] or not name.strip():
                  raise SystemExit('Candidate version must be newer than the published version.')
              manifest.update(version_code=int(code), version_name=name.strip())
              path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n')
          PY

      - name: Build signed release APK
        env:
          KAJOVO_UPLOAD_STORE_FILE: ${{ runner.temp }}/kajovo-upload.keystore
          KAJOVO_UPLOAD_STORE_PASSWORD: ${{ secrets.HOTEL_ADMIN_PASSWORD }}
          KAJOVO_UPLOAD_KEY_ALIAS: ${{ secrets.KAJOVO_UPLOAD_KEY_ALIAS }}
          KAJOVO_UPLOAD_KEY_PASSWORD: ${{ secrets.HOTEL_ADMIN_PASSWORD }}
        run: ./gradlew :app:assembleRelease --console=plain

      - name: Verify release signature and checksum
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner -print | sort -V | tail -1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          sha256sum "$APK" | tee app/build/outputs/apk/release/app-release.apk.sha256

      - name: Upload signed APK
        uses: actions/upload-artifact@v6
        with:
          name: kajovo-hotel-android-signed-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/release/app-release.apk.sha256
          if-no-files-found: error
          retention-days: 7
