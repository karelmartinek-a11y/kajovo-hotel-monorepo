name: CI Gates - Kajovo Hotel

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-gates-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  HOTEL_ADMIN_EMAIL: ${{ secrets.HOTEL_ADMIN_EMAIL != '' && secrets.HOTEL_ADMIN_EMAIL || vars.HOTEL_ADMIN_EMAIL }}
  HOTEL_ADMIN_PASSWORD: ${{ secrets.HOTEL_ADMIN_PASSWORD != '' && secrets.HOTEL_ADMIN_PASSWORD || vars.HOTEL_ADMIN_PASSWORD }}
  KAJOVO_API_ADMIN_EMAIL: ${{ secrets.KAJOVO_API_ADMIN_EMAIL != '' && secrets.KAJOVO_API_ADMIN_EMAIL || vars.KAJOVO_API_ADMIN_EMAIL || secrets.HOTEL_ADMIN_EMAIL || vars.HOTEL_ADMIN_EMAIL }}
  KAJOVO_API_ADMIN_PASSWORD: ${{ secrets.KAJOVO_API_ADMIN_PASSWORD != '' && secrets.KAJOVO_API_ADMIN_PASSWORD || vars.KAJOVO_API_ADMIN_PASSWORD || secrets.HOTEL_ADMIN_PASSWORD || vars.HOTEL_ADMIN_PASSWORD }}

jobs:
  cancel-stale-main-ci:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Cancel stale main CI runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs?branch=main&per_page=100" > /tmp/main-runs.json
          jq -r --arg sha "${GITHUB_SHA}" --argjson current "${GITHUB_RUN_ID}" '
            .workflow_runs[]
            | select(
                .event == "push"
                and .head_branch == "main"
                and .head_sha != $sha
                and .id != $current
                and (.status == "queued" or .status == "in_progress")
                and (
                  .name == "CI Gates - Kajovo Hotel"
                  or .name == "CI Full - Kajovo Hotel"
                  or .name == "CI Release - Kajovo Hotel"
                )
              )
            | .id
          ' /tmp/main-runs.json | while read -r run_id; do
            [ -n "$run_id" ] || continue
            echo "Cancelling stale main CI run $run_id"
            gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" >/dev/null || true
          done

  api-runtime-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Build production API image and verify imports
        run: |
          docker build -f apps/kajovo-hotel-api/Dockerfile -t kajovo-api-ci .
          docker run --rm --entrypoint python kajovo-api-ci -c "from app.main import app; import pywebpush, firebase_admin; from app.services.housekeeping import COUNTRY_TRANSLATION; assert COUNTRY_TRANSLATION.gettext('Germany') == 'Německo'; assert '/api/v1/admin/voice-core/sessions' in app.openapi()['paths']; assert len([path for path in app.openapi()['paths'] if path.startswith('/api/v1/admin/voice-core/')]) == 3; assert any(path.startswith('/api/v1/chat') for path in app.openapi()['paths'])"

      - name: Build frontends and verify the production proxy chain
        # Voice sessions use the authenticated /api proxy.
        run: |
          docker tag kajovo-api-ci voice-core-api-check
          docker build -f apps/kajovo-hotel-admin/Dockerfile -t voice-core-admin-check .
          docker build -f apps/kajovo-hotel-web/Dockerfile -t voice-core-web-check .
          python3 scripts/verify_voice_core_proxy.py

  web-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Enable pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install API Python dependencies (minimal)
        run: |
          python -m pip install --upgrade pip
          python -m pip install "fastapi==0.115.14" "pydantic==2.11.10" "pydantic-settings==2.11.0" "sqlalchemy==2.0.44" "uvicorn[standard]==0.30.6" "python-multipart==0.0.20" "cryptography==43.0.3" "pypdf==5.9.0" "pycountry==24.6.1" "reportlab==4.5.1"
          python -m pip install ./packages/voice-core-server

      - name: Install Playwright browsers
        run: pnpm --filter @kajovo/kajovo-hotel-web exec playwright install --with-deps

      - name: Web tests (Playwright)
        run: pnpm --filter @kajovo/kajovo-hotel-web test

  release-gate:
    needs:
      - api-runtime-image
      - web-tests
      - e2e-smoke
      - guardrails
      - lint
      - typecheck
      - unit-tests
      - portable-voice-core
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        shell: bash
        run: |
          set -euo pipefail
          test "${{ needs.api-runtime-image.result }}" = "success"
          test "${{ needs.web-tests.result }}" = "success"
          test "${{ needs.e2e-smoke.result }}" = "success"
          test "${{ needs.guardrails.result }}" = "success"
          test "${{ needs.lint.result }}" = "success"
          test "${{ needs.typecheck.result }}" = "success"
          test "${{ needs.unit-tests.result }}" = "success"
          test "${{ needs.portable-voice-core.result }}" = "success"
          echo "All authoritative main CI jobs PASS for ${GITHUB_SHA}"

      - name: Write release gate artifact
        shell: bash
        run: |
          mkdir -p artifacts/release-gate
          printf '{"sha":"%s","overall_status":"PASS","workflow":"ci-gates"}\n' "${GITHUB_SHA}" > "artifacts/release-gate/release-gate-${GITHUB_SHA}.json"

      - name: Upload release gate artifact
        uses: actions/upload-artifact@v6
        with:
          name: release-gate-artifact
          path: artifacts/release-gate/*.json
          if-no-files-found: error

  e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Enable pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install API Python dependencies (minimal)
        run: |
          python -m pip install --upgrade pip
          python -m pip install "fastapi==0.115.14" "pydantic==2.11.10" "pydantic-settings==2.11.0" "sqlalchemy==2.0.44" "uvicorn[standard]==0.30.6" "python-multipart==0.0.20" "cryptography==43.0.3" "pypdf==5.9.0" "pycountry==24.6.1" "reportlab==4.5.1"

      - name: Install portable Voice Core runtime
        run: python -m pip install ./packages/voice-core-server

      - name: Validate admin credential environment
        run: python scripts/check_admin_credentials_env.py

      - name: Install Playwright browser for smoke
        run: pnpm --filter @kajovo/kajovo-hotel-admin exec playwright install --with-deps chromium

      - name: E2E smoke (3 deterministic runs)
        env:
          API_BASE_URL: http://127.0.0.1:18000
          SMOKE_DB_PATH: /tmp/kajovo-smoke-e2e.db
        run: |
          for i in 1 2 3; do
            echo "Smoke run #${i}"
            rm -f "$SMOKE_DB_PATH"
            pnpm ci:e2e-smoke
          done
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Enable pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install API Python dependencies (minimal)
        run: |
          python -m pip install --upgrade pip
          python -m pip install "fastapi==0.115.14" "pydantic==2.11.10" "pydantic-settings==2.11.0" "sqlalchemy==2.0.44" "alembic==1.17.1" "uvicorn[standard]==0.30.6" "python-multipart==0.0.20" "cryptography==43.0.3" "pypdf==5.9.0" "pycountry==24.6.1" "reportlab==4.5.1"

      - name: Android production acceptance rollback policy
        run: |
          node --check scripts/verify_android_employee_production.mjs
          node --check scripts/cleanup_android_production_acceptance.mjs
          node --test scripts/android_production_acceptance_policy.test.mjs

      - name: Install portable Voice Core runtime
        run: python -m pip install ./packages/voice-core-server

      - name: Validate admin credential environment
        run: python scripts/check_admin_credentials_env.py

      - name: Policy sentinel gate
        run: pnpm ci:policy

      - name: Policy rule unit tests
        run: pnpm ci:policy-test

      - name: Token-only lint
        run: pnpm ci:tokens

      - name: Brand assets lint (brand/** whitelist)
        run: pnpm ci:brand-assets

      - name: Install Playwright browser
        run: pnpm --filter @kajovo/kajovo-hotel-web exec playwright install --with-deps chromium

      - name: Web live smoke gate
        run: pnpm ci:web-smoke

      - name: KDGS signage declaration gate
        run: pnpm ci:signage

      - name: Portal translation completeness
        run: pnpm ci:portal-translations

      - name: KDGS visual geometry gate
        run: pnpm ci:visual

      - name: Verify API contract + generated client freshness
        run: pnpm contract:check

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install API dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./packages/voice-core-server
          python -m pip install -e ./apps/kajovo-hotel-api[dev]

      - name: Ruff lint
        run: python -m ruff check apps/kajovo-hotel-api/app apps/kajovo-hotel-api/tests packages/voice-core-server scripts/check_voice_core_boundaries.py scripts/verify_voice_core_copy_out.py scripts/verify_voice_core_proxy.py scripts/voice_core_live_smoke.py scripts/check_release_review.py scripts/cleanup_accepted_release.py scripts/independent_review.py

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Enable pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Typecheck
        run: pnpm typecheck

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Enable pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install API dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./packages/voice-core-server
          python -m pip install -e ./apps/kajovo-hotel-api[dev]

      - name: Unit tests
        run: pnpm unit

  portable-voice-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: corepack enable && corepack prepare pnpm@10.34.4 --activate
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install ./packages/voice-core-server pytest
      - name: Independent forensic review covers exact candidate source
        run: python scripts/independent_review.py --repo hotel
      - run: pnpm ci:voice-core
      - run: python scripts/verify_voice_core_copy_out.py
      - run: pnpm --filter @voice-core/browser exec playwright install --with-deps chromium webkit
      - run: pnpm --filter @voice-core/browser test:ui
      - name: Verify live smoke is opt-in
        run: python scripts/voice_core_live_smoke.py scripts/check_release_review.py scripts/cleanup_accepted_release.py
