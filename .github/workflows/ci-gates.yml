name: CI Gates - Kajovo Hotel
'on':
  push:
    branches:
    - main
  workflow_dispatch:
    inputs:
      force_full:
        description: Run every validation suite as a manual diagnostic
        type: boolean
        default: true
  workflow_call:
    inputs:
      force_full:
        type: boolean
        default: false
    outputs:
      deploy_required:
        description: Whether the exact candidate has verified deployable runtime changes
        value: ${{ jobs.release-gate.outputs.deploy_required }}
permissions:
  contents: read
  actions: read
concurrency:
  group: validation-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  HOTEL_ADMIN_EMAIL: admin@ci.invalid
  HOTEL_ADMIN_PASSWORD: ci-local-admin-password
  KAJOVO_API_ADMIN_EMAIL: admin@ci.invalid
  KAJOVO_API_ADMIN_PASSWORD: ci-local-admin-password
defaults:
  run:
    shell: bash
jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.route.outputs.full }}
      python: ${{ steps.route.outputs.python }}
      api: ${{ steps.route.outputs.api }}
      web: ${{ steps.route.outputs.web }}
      admin: ${{ steps.route.outputs.admin }}
      android: ${{ steps.route.outputs.android }}
      voice: ${{ steps.route.outputs.voice }}
      visual_web: ${{ steps.route.outputs.visual_web }}
      visual_admin: ${{ steps.route.outputs.visual_admin }}
      review_required: ${{ steps.route.outputs.review_required }}
      review_profile: ${{ steps.route.outputs.review_profile }}
      deploy_required: ${{ steps.route.outputs.deploy_required }}
      runtime_images: ${{ steps.route.outputs.runtime_images }}
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - name: Resolve dependency-aware validation scope
      id: route
      env:
        SCOPE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        FORCE_FULL: ${{ inputs.force_full || false }}
        GH_TOKEN: ${{ github.token }}
      run: |-
        set -euo pipefail
        base="$SCOPE_BASE"
        if [ "$FORCE_FULL" = true ]; then base=""; fi
        python scripts/ci_scope.py --base "$base" --head "$GITHUB_SHA" --github-output "$GITHUB_OUTPUT" > ci-scope.json
    - name: Preserve routing evidence
      uses: actions/upload-artifact@v6
      with:
        name: ci-scope-${{ github.sha }}
        path: ci-scope.json
        if-no-files-found: error
        retention-days: 7
  fast-checks:
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
    - uses: actions/checkout@v5
    - uses: ./.github/actions/setup-python
      with:
        profile: lint
    - name: Fail fast on Python lint
      run: python -m ruff check apps/kajovo-hotel-api/app apps/kajovo-hotel-api/tests packages/voice-core-server scripts/check_voice_core_boundaries.py scripts/verify_voice_core_copy_out.py scripts/verify_voice_core_proxy.py
        scripts/voice_core_live_smoke.py scripts/check_release_review.py scripts/cleanup_accepted_release.py scripts/independent_review.py scripts/ci_scope.py scripts/build_release_images.py scripts/release_images.py
        scripts/check_ci_required_jobs.py
      if: needs.scope.outputs.python == 'true'
    - uses: ./.github/actions/setup-node
      with:
        install: ${{ needs.scope.outputs.web == 'true' || needs.scope.outputs.admin == 'true' || needs.scope.outputs.voice == 'true' }}
    - name: Workspace TypeScript checks
      run: pnpm lint
      if: needs.scope.outputs.web == 'true' || needs.scope.outputs.admin == 'true' || needs.scope.outputs.voice == 'true'
    - name: CI routing and runtime policy regression tests
      run: |-
        python -m pytest --noconftest scripts/tests/test_ci_*.py scripts/tests/test_native_mcp_cutover.py scripts/tests/test_release_images.py -q
        node --test scripts/android_production_acceptance_policy.test.mjs
        node --check scripts/verify_android_employee_production.mjs
        node --check scripts/cleanup_android_production_acceptance.mjs
  guardrails:
    needs:
    - scope
    - fast-checks
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - uses: ./.github/actions/setup-node
      with:
        install: 'false'
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - name: Source, policy, tokens, brand and signage checks
      run: |-
        pnpm ci:text-integrity
        pnpm ci:frontend-manifest
        pnpm ci:legacy-guards
        pnpm ci:runtime-integrity
        pnpm ci:policy
        pnpm ci:policy-test
        pnpm ci:tokens
        pnpm ci:brand-assets
        pnpm ci:signage
        pnpm ci:portal-translations
  contract:
    needs:
    - scope
    - fast-checks
    - guardrails
    if: needs.scope.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
    - uses: actions/checkout@v5
    - uses: ./.github/actions/setup-node
    - uses: ./.github/actions/setup-python
      with:
        profile: dev
    - name: Verify API contract and generated client freshness
      run: pnpm contract:check
  api-runtime-image:
    needs:
    - scope
    - fast-checks
    - guardrails
    if: needs.scope.outputs.runtime_images == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v5
    - uses: docker/setup-buildx-action@v3
    - name: Build immutable production api image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: apps/kajovo-hotel-api/Dockerfile
        platforms: linux/amd64
        load: true
        tags: kajovo-hotel-api:${{ github.sha }}
        cache-from: type=gha,scope=hotel-api
        cache-to: type=gha,mode=max,scope=hotel-api
    - name: Build immutable production admin image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: apps/kajovo-hotel-admin/Dockerfile
        platforms: linux/amd64
        load: true
        tags: kajovo-hotel-admin:${{ github.sha }}
        cache-from: type=gha,scope=hotel-admin
        cache-to: type=gha,mode=max,scope=hotel-admin
    - name: Build immutable production web image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: apps/kajovo-hotel-web/Dockerfile
        platforms: linux/amd64
        load: true
        tags: kajovo-hotel-web:${{ github.sha }}
        cache-from: type=gha,scope=hotel-web
        cache-to: type=gha,mode=max,scope=hotel-web
    - name: Verify production images and package their exact IDs
      run: python scripts/build_release_images.py --existing --sha "$GITHUB_SHA" --output artifacts/release-images
    - name: Upload verified immutable release images
      uses: actions/upload-artifact@v6
      with:
        name: release-images-${{ github.sha }}
        compression-level: 0
        path: artifacts/release-images
        if-no-files-found: error
        retention-days: 7
  web-tests:
    needs:
    - scope
    - fast-checks
    - guardrails
    if: needs.scope.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
    - uses: actions/checkout@v5
    - uses: ./.github/actions/setup-playwright
    - uses: ./.github/actions/setup-python
      with:
        profile: runtime
    - name: Web live smoke, once
      run: pnpm ci:web-smoke
    - name: Preserve browser failure evidence
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: web-browser-evidence-${{ github.run_id }}
        path: |-
          apps/*/test-results/
          apps/*/playwright-report/
          packages/voice-core/test-results/
          packages/voice-core/playwright-report/
        if-no-files-found: warn
        retention-days: 7
  e2e-smoke:
    needs:
    - scope
    - fast-checks
    - guardrails
    if: needs.scope.outputs.admin == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
    - uses: actions/checkout@v5
    - uses: ./.github/actions/setup-playwright
    - uses: ./.github/actions/setup-python
      with:
        profile: runtime
    - name: Admin authentication and functional smoke, once
      run: pnpm ci:e2e-smoke
    - name: Preserve browser failure evidence
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: admin-browser-evidence-${{ github.run_id }}
        path: |-
          apps/*/test-results/
          apps/*/playwright-report/
          packages/voice-core/test-results/
          packages/voice-core/playwright-report/
        if-no-files-found: warn
        retention-days: 7
  visual-web:
    needs:
    - scope
    - fast-checks
    - guardrails
    if: needs.scope.outputs.visual_web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
    - uses: actions/checkout@v5
    - uses: ./.github/actions/setup-playwright
    - uses: ./.github/actions/setup-python
      with:
        profile: runtime
    - name: All portal visual scenarios and viewports
      run: pnpm ci:visual-web
    - name: Preserve browser failure evidence
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: visual_web-browser-evidence-${{ github.run_id }}
        path: |-
          apps/*/test-results/
          apps/*/playwright-report/
          packages/voice-core/test-results/
          packages/voice-core/playwright-report/
        if-no-files-found: warn
        retention-days: 7
  visual-admin:
    needs:
    - scope
    - fast-checks
    - guardrails
    if: needs.scope.outputs.visual_admin == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
    - uses: actions/checkout@v5
    - uses: ./.github/actions/setup-playwright
    - uses: ./.github/actions/setup-python
      with:
        profile: runtime
    - name: All admin visual scenarios and viewports, one worker
      run: pnpm ci:visual-admin
    - name: Preserve browser failure evidence
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: visual_admin-browser-evidence-${{ github.run_id }}
        path: |-
          apps/*/test-results/
          apps/*/playwright-report/
          packages/voice-core/test-results/
          packages/voice-core/playwright-report/
        if-no-files-found: warn
        retention-days: 7
  unit-tests:
    needs:
    - scope
    - fast-checks
    - guardrails
    if: needs.scope.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v5
    - uses: ./.github/actions/setup-python
      with:
        profile: dev
    - name: API unit and integration tests
      run: python -m pytest apps/kajovo-hotel-api/tests --junitxml=artifacts/pytest/api.xml
    - name: Preserve Python test evidence
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: api-test-evidence-${{ github.run_id }}
        path: artifacts/pytest
        if-no-files-found: warn
        retention-days: 7
  portable-voice-core:
    needs:
    - scope
    - fast-checks
    - guardrails
    if: needs.scope.outputs.voice == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
    - uses: actions/checkout@v5
    - uses: ./.github/actions/setup-playwright
    - uses: ./.github/actions/setup-python
      with:
        profile: portable
    - name: Portable Voice Core, copy-out and responsive UI
      run: |-
        pnpm ci:voice-core
        python scripts/verify_voice_core_copy_out.py
        pnpm --filter @voice-core/browser test:ui
        python scripts/voice_core_live_smoke.py
    - name: Preserve browser failure evidence
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: voice-browser-evidence-${{ github.run_id }}
        path: |-
          apps/*/test-results/
          apps/*/playwright-report/
          packages/voice-core/test-results/
          packages/voice-core/playwright-report/
        if-no-files-found: warn
        retention-days: 7
  android-contract:
    needs:
    - scope
    - fast-checks
    - guardrails
    if: needs.scope.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'
        cache: gradle
    - uses: android-actions/setup-android@v4
    - name: Verify all native API consumer unit tests
      working-directory: android
      run: ./gradlew testDebugUnitTest --console=plain
    - name: Preserve Android contract test evidence
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: android-contract-evidence-${{ github.run_id }}
        path: |-
          android/**/build/test-results/**
          android/**/build/reports/tests/**
        if-no-files-found: warn
        retention-days: 7
  release-gate:
    needs:
    - scope
    - fast-checks
    - guardrails
    - contract
    - api-runtime-image
    - web-tests
    - e2e-smoke
    - visual-web
    - visual-admin
    - unit-tests
    - portable-voice-core
    - android-contract
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deploy_required: ${{ needs.scope.outputs.deploy_required }}
    steps:
    - uses: actions/checkout@v5
    - name: Fail closed on required job results and scope
      env:
        NEEDS_JSON: ${{ toJSON(needs) }}
      run: python scripts/check_ci_required_jobs.py
    - name: Upload exact-SHA release gate evidence
      uses: actions/upload-artifact@v6
      with:
        name: release-gate-artifact
        path: artifacts/release-gate/*.json
        if-no-files-found: error
        retention-days: 7
