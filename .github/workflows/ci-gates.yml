name: CI Gates - Kajovo Hotel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hotel-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  HOTEL_ADMIN_EMAIL: ${{ secrets.HOTEL_ADMIN_EMAIL != '' && secrets.HOTEL_ADMIN_EMAIL || vars.HOTEL_ADMIN_EMAIL }}
  HOTEL_ADMIN_PASSWORD: ${{ secrets.HOTEL_ADMIN_PASSWORD != '' && secrets.HOTEL_ADMIN_PASSWORD || vars.HOTEL_ADMIN_PASSWORD }}
  KAJOVO_API_ADMIN_EMAIL: ${{ secrets.KAJOVO_API_ADMIN_EMAIL != '' && secrets.KAJOVO_API_ADMIN_EMAIL || vars.KAJOVO_API_ADMIN_EMAIL || secrets.HOTEL_ADMIN_EMAIL || vars.HOTEL_ADMIN_EMAIL }}
  KAJOVO_API_ADMIN_PASSWORD: ${{ secrets.KAJOVO_API_ADMIN_PASSWORD != '' && secrets.KAJOVO_API_ADMIN_PASSWORD || vars.KAJOVO_API_ADMIN_PASSWORD || secrets.HOTEL_ADMIN_PASSWORD || vars.HOTEL_ADMIN_PASSWORD }}

jobs:
  api-runtime-image:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Build production API image and verify imports
        run: |
          docker build -f apps/kajovo-hotel-api/Dockerfile -t kajovo-api-ci .
          docker run --rm --entrypoint python kajovo-api-ci -c "from app.main import app; import pywebpush, firebase_admin, mcp, websockets, jsonschema; from app.services.housekeeping import COUNTRY_TRANSLATION; assert COUNTRY_TRANSLATION.gettext('Germany') == 'Německo'; assert '/api/v1/admin/voice-core/sessions/{session_id}/heartbeat' in app.openapi()['paths']; assert any(path.startswith('/api/v1/chat') for path in app.openapi()['paths'])"

      - name: Build frontends and verify the production proxy chain
        run: |
          docker tag kajovo-api-ci voice-core-api-check
          docker build -f apps/kajovo-hotel-admin/Dockerfile -t voice-core-admin-check .
          docker build -f apps/kajovo-hotel-web/Dockerfile -t voice-core-web-check .
          python3 scripts/verify_voice_core_proxy.py

  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install pinned pnpm and locked dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.34.4 --activate
          pnpm install --frozen-lockfile
      - name: Install API and test dependencies
        run: python -m pip install ./packages/voice-core-server -e './apps/kajovo-hotel-api[dev]'
      - name: Validate test credential configuration
        run: python scripts/check_admin_credentials_env.py
      - name: Install browser engines
        run: pnpm --filter @voice-core/browser exec playwright install --with-deps chromium webkit
      - name: Validate the complete SSOT test plan once
        run: python scripts/release_gate.py
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: validation-evidence
          path: |
            artifacts/release-gate/*.json
            apps/kajovo-hotel-web/test-results/
            apps/kajovo-hotel-admin/test-results/
            packages/voice-core/test-results/
          if-no-files-found: warn
