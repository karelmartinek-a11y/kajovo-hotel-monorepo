name: CI Gates - Kajovo Hotel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hotel-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  HOTEL_ADMIN_EMAIL: ${{ secrets.HOTEL_ADMIN_EMAIL != '' && secrets.HOTEL_ADMIN_EMAIL || vars.HOTEL_ADMIN_EMAIL }}
  HOTEL_ADMIN_PASSWORD: ${{ secrets.HOTEL_ADMIN_PASSWORD != '' && secrets.HOTEL_ADMIN_PASSWORD || vars.HOTEL_ADMIN_PASSWORD }}
  KAJOVO_API_ADMIN_EMAIL: ${{ secrets.KAJOVO_API_ADMIN_EMAIL != '' && secrets.KAJOVO_API_ADMIN_EMAIL || vars.KAJOVO_API_ADMIN_EMAIL || secrets.HOTEL_ADMIN_EMAIL || vars.HOTEL_ADMIN_EMAIL }}
  KAJOVO_API_ADMIN_PASSWORD: ${{ secrets.KAJOVO_API_ADMIN_PASSWORD != '' && secrets.KAJOVO_API_ADMIN_PASSWORD || vars.KAJOVO_API_ADMIN_PASSWORD || secrets.HOTEL_ADMIN_PASSWORD || vars.HOTEL_ADMIN_PASSWORD }}

jobs:
  api-runtime-image:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Build production API image and verify imports
        run: |
          docker build -f apps/kajovo-hotel-api/Dockerfile -t kajovo-api-ci .
          docker run --rm --entrypoint python kajovo-api-ci -c "from app.main import app; import pywebpush, firebase_admin; from app.services.housekeeping import COUNTRY_TRANSLATION; assert COUNTRY_TRANSLATION.gettext('Germany') == 'Německo'; assert not any('/diagnostics' in path or '/voice-core' in path or '/voice-memory' in path for path in app.openapi()['paths']); assert not hasattr(app.state, 'dagmar'); assert any(path.startswith('/api/v1/chat') for path in app.openapi()['paths'])"

      - name: Verify deployment snapshots and stale release cleanup with the real API image
        run: python3 scripts/verify_deploy_snapshot.py


      - name: Build frontends and verify the production proxy chain
        run: |
          docker tag kajovo-api-ci voice-core-api-check
          docker build -f apps/kajovo-hotel-admin/Dockerfile -t voice-core-admin-check .
          docker build -f apps/kajovo-hotel-web/Dockerfile -t voice-core-web-check .
          python3 scripts/verify_voice_core_proxy.py

  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      inventory-postgres:
        image: postgres:16.15-alpine3.23
        env:
          POSTGRES_DB: inventory_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: inventory_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d inventory_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      HOTEL_INVENTORY_TEST_DATABASE_URL: postgresql+psycopg://postgres:inventory_ci_only@127.0.0.1:5432/inventory_test
      CML_PROFILE_TEST_DATABASE_URL: postgresql+psycopg://postgres:inventory_ci_only@127.0.0.1:5432/inventory_test
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install pinned pnpm and locked dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.34.4 --activate
          pnpm install --frozen-lockfile
      - name: Install API and test dependencies
        run: python -m pip install -e './apps/kajovo-hotel-api[dev]'
      - name: Validate test credential configuration
        run: python scripts/check_admin_credentials_env.py
      - name: Install browser engines
        run: pnpm --filter @kajovo/kajovo-hotel-web exec playwright install --with-deps chromium webkit
      - name: Validate the complete SSOT test plan once
        run: python scripts/release_gate.py
      - name: Detect housekeeping layout changes
        id: housekeeping
        run: |
          if git diff --quiet HEAD^ HEAD -- packages/ui apps/kajovo-hotel-web/tests/live-smoke.spec.ts; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate changed housekeeping layout
        if: steps.housekeeping.outputs.changed == 'true'
        run: node scripts/run-playwright-with-api.js --app apps/kajovo-hotel-web tests/live-smoke.spec.ts -- --grep 'pevná razítka|500 variant|doplní název' --project desktop --project tablet --project phone --workers 1
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: validation-evidence
          path: |
            artifacts/release-gate/*.json
            apps/kajovo-hotel-web/test-results/
            apps/kajovo-hotel-admin/test-results/
            packages/voice-core/test-results/
          if-no-files-found: warn
