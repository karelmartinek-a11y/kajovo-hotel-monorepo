name: CI Stability - Kajovo Hotel
'on':
  schedule:
  - cron: 0 2 * * *
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: stability-${{ github.ref }}
  cancel-in-progress: true
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  HOTEL_ADMIN_EMAIL: admin@ci.invalid
  HOTEL_ADMIN_PASSWORD: ci-local-admin-password
  KAJOVO_API_ADMIN_EMAIL: admin@ci.invalid
  KAJOVO_API_ADMIN_PASSWORD: ci-local-admin-password
defaults:
  run:
    shell: bash
jobs:
  admin-stability:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
    - uses: actions/checkout@v5
    - uses: ./.github/actions/setup-playwright
    - uses: ./.github/actions/setup-python
      with:
        profile: runtime
    - name: 'Admin stability: three isolated complete smoke runs'
      run: |-
        status=0
        for attempt in 1 2 3; do
          export SMOKE_DB_PATH="$RUNNER_TEMP/kajovo-stability-${attempt}.db"
          export SMOKE_SMTP_CAPTURE_PATH="$RUNNER_TEMP/kajovo-stability-${attempt}-smtp.jsonl"
          if pnpm ci:e2e-smoke; then
            echo "Smoke run ${attempt}: PASS"
          else
            status=1
            echo "Smoke run ${attempt}: FAIL"
          fi
          evidence="artifacts/ci-stability/run-${attempt}"
          mkdir -p "$evidence"
          for directory in apps/kajovo-hotel-admin/test-results apps/kajovo-hotel-admin/playwright-report; do
            if [ -d "$directory" ]; then cp -R "$directory" "$evidence/"; fi
          done
        done
        exit "$status"
    - name: Preserve browser failure evidence
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: admin-stability-evidence-${{ github.run_id }}
        path: |-
          apps/*/test-results/
          apps/*/playwright-report/
          packages/voice-core/test-results/
          packages/voice-core/playwright-report/
          artifacts/ci-stability/
        if-no-files-found: warn
        retention-days: 7
