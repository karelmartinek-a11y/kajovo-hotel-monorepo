name: Deploy - hotel.hcasc.cz

on:
  workflow_run:
    workflows: ["CI Gates - Kajovo Hotel"]
    types:
      - completed
    branches:
      - main

concurrency:
  group: deploy-hotel-hcasc-production
  cancel-in-progress: true

permissions: {}

jobs:
  deploy-production:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment: production
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
      DEPLOY_BASE_URL: https://hotel.hcasc.cz
      PRODUCTION_SERVER_IPV4: 89.221.222.92
      HOTEL_DEPLOY_HOST: ${{ secrets.HOTEL_DEPLOY_HOST != '' && secrets.HOTEL_DEPLOY_HOST || vars.HOTEL_DEPLOY_HOST }}
      HOTEL_DEPLOY_PORT: ${{ secrets.HOTEL_DEPLOY_PORT != '' && secrets.HOTEL_DEPLOY_PORT || vars.HOTEL_DEPLOY_PORT }}
      HOTEL_DEPLOY_USER: ${{ secrets.HOTEL_DEPLOY_USER != '' && secrets.HOTEL_DEPLOY_USER || vars.HOTEL_DEPLOY_USER }}
      HOTEL_DEPLOY_PASS: ${{ secrets.HOTEL_DEPLOY_PASS != '' && secrets.HOTEL_DEPLOY_PASS || vars.HOTEL_DEPLOY_PASS }}
      HOTEL_DEPLOY_KEY: ${{ secrets.HOTEL_DEPLOY_KEY }}
      HOTEL_ADMIN_EMAIL: ${{ secrets.HOTEL_ADMIN_EMAIL != '' && secrets.HOTEL_ADMIN_EMAIL || vars.HOTEL_ADMIN_EMAIL }}
      HOTEL_ADMIN_PASSWORD: ${{ secrets.HOTEL_ADMIN_PASSWORD != '' && secrets.HOTEL_ADMIN_PASSWORD || vars.HOTEL_ADMIN_PASSWORD }}
      KAJOVO_API_ADMIN_EMAIL: ${{ secrets.KAJOVO_API_ADMIN_EMAIL != '' && secrets.KAJOVO_API_ADMIN_EMAIL || vars.KAJOVO_API_ADMIN_EMAIL || secrets.HOTEL_ADMIN_EMAIL || vars.HOTEL_ADMIN_EMAIL }}
      KAJOVO_API_ADMIN_PASSWORD: ${{ secrets.KAJOVO_API_ADMIN_PASSWORD != '' && secrets.KAJOVO_API_ADMIN_PASSWORD || vars.KAJOVO_API_ADMIN_PASSWORD || secrets.HOTEL_ADMIN_PASSWORD || vars.HOTEL_ADMIN_PASSWORD }}
      BETTER_HOTEL_CONNECTOR_BASE_URL: ${{ vars.BETTER_HOTEL_CONNECTOR_BASE_URL != '' && vars.BETTER_HOTEL_CONNECTOR_BASE_URL || 'https://api.better-hotel.com/api/connector/v/1' }}
      BETTER_HOTEL_ACCESS_TOKEN: ${{ secrets.A_TOKEN != '' && secrets.A_TOKEN || secrets.A_token }}
      BETTER_HOTEL_CLIENT_TOKEN: ${{ secrets.C_TOKEN != '' && secrets.C_TOKEN || secrets.C_token }}
    steps:
      - name: Checkout deploy SHA
        uses: actions/checkout@v5
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Validate deploy target environment
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${HOTEL_DEPLOY_HOST:-}" ]; then
            echo "Missing HOTEL_DEPLOY_HOST in GitHub secrets or variables." >&2
            exit 1
          fi
          if [ -z "${HOTEL_DEPLOY_PORT:-}" ]; then
            echo "Missing HOTEL_DEPLOY_PORT in GitHub secrets or variables." >&2
            exit 1
          fi
          if [ -z "${HOTEL_DEPLOY_USER:-}" ]; then
            echo "Missing HOTEL_DEPLOY_USER in GitHub secrets or variables." >&2
            exit 1
          fi
          if [ -z "${HOTEL_DEPLOY_PASS:-}" ] && [ -z "${HOTEL_DEPLOY_KEY:-}" ]; then
            echo "Missing HOTEL_DEPLOY_PASS or HOTEL_DEPLOY_KEY in GitHub secrets or variables." >&2
            exit 1
          fi
          resolved_ipv4=""
          if [[ "$HOTEL_DEPLOY_HOST" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            resolved_ipv4="$HOTEL_DEPLOY_HOST"
          else
            resolved_ipv4="$(getent ahostsv4 "$HOTEL_DEPLOY_HOST" | awk '{print $1}' | sort -u | paste -sd ',' -)"
          fi
          if [[ -z "$resolved_ipv4" ]]; then
            echo "Nepodarilo se zjistit IPv4 adresu pro HOTEL_DEPLOY_HOST=$HOTEL_DEPLOY_HOST" >&2
            exit 1
          fi
          if [[ ",$resolved_ipv4," != *",${PRODUCTION_SERVER_IPV4},"* ]]; then
            echo "HOTEL_DEPLOY_HOST nemiri na produkcni server ${PRODUCTION_SERVER_IPV4}. Resolved IPv4: ${resolved_ipv4}" >&2
            exit 1
          fi
          echo "Deploy target environment check: PASS"

      - name: Validate admin credential environment
        run: python scripts/check_admin_credentials_env.py

      - name: Validate Better Hotel credential environment
        run: python scripts/check_better_hotel_credentials_env.py

      - name: Build release archive
        shell: bash
        run: |
          set -euo pipefail
          archive="kajovo-deploy-${DEPLOY_SHA}.tar.gz"
          git archive --format=tar.gz --output "$archive" "$DEPLOY_SHA"
          echo "RELEASE_ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Setup SSH deploy tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openssh-client sshpass
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -p "$HOTEL_DEPLOY_PORT" "$HOTEL_DEPLOY_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          if [ -n "${HOTEL_DEPLOY_KEY:-}" ]; then
            printf '%s\n' "$HOTEL_DEPLOY_KEY" > "$RUNNER_TEMP/hotel_deploy_key"
            chmod 600 "$RUNNER_TEMP/hotel_deploy_key"
            echo "SSH_IDENTITY_FILE=$RUNNER_TEMP/hotel_deploy_key" >> "$GITHUB_ENV"
          fi

      - name: Verify remote nginx sync helper
        shell: bash
        run: |
          python3 scripts/github_deploy_via_ssh.py check-helper

      - name: Deploy uploaded release via SSH
        shell: bash
        run: |
          python3 scripts/github_deploy_via_ssh.py deploy

      - name: Verify deploy runtime artifact on server
        shell: bash
        run: |
          python3 scripts/github_deploy_via_ssh.py verify-artifact

      - name: Write deploy verification artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          payload = {
              "verified_at": datetime.now(timezone.utc).isoformat(),
              "sha": os.environ["DEPLOY_SHA"],
              "base_url": os.environ["DEPLOY_BASE_URL"],
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "remote_runtime_artifact": f"/home/{os.environ['HOTEL_DEPLOY_USER']}/kajovo-deploy-releases/{os.environ['DEPLOY_SHA']}/artifacts/deploy-runtime/latest.json",
              "server_runtime_artifact_sha_verified": True,
          }
          Path("artifacts/latest.json").write_text(
              json.dumps(payload, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Route deploy verification to target host
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$HOTEL_DEPLOY_HOST" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "$HOTEL_DEPLOY_HOST hotel.hcasc.cz" | sudo tee -a /etc/hosts >/dev/null
            getent hosts hotel.hcasc.cz
          else
            echo "HOTEL_DEPLOY_HOST is not an IPv4 address; live verification will use DNS."
          fi

      - name: Post-deploy HTTP gate
        shell: bash
        run: |
          set -euo pipefail
          check_endpoint() {
            local url="$1"
            local label="$2"
            local expected="$3"
            local code=""
            for attempt in $(seq 1 30); do
              code=$(curl -k -sS -o /tmp/deploy-check-body.txt -w '%{http_code}' "$url" || true)
              if [[ "$code" == "$expected" ]]; then
                echo "$label PASS ($code)"
                return 0
              fi
              echo "$label attempt $attempt/30 -> HTTP $code"
              sleep 10
            done
            echo "$label FAIL -> expected HTTP $expected, got $code" >&2
            cat /tmp/deploy-check-body.txt >&2 || true
            return 1
          }
          check_endpoint "$DEPLOY_BASE_URL/" "public root" "200"
          check_endpoint "$DEPLOY_BASE_URL/admin/login" "admin login page" "200"
          check_endpoint "$DEPLOY_BASE_URL/api/health" "api health" "200"

      - name: Verify live breakfast manual refresh
        run: node scripts/verify_live_breakfast_manual_refresh.mjs
        env:
          VERIFY_BASE_URL: ${{ env.DEPLOY_BASE_URL }}
          VERIFY_ADMIN_EMAIL: ${{ env.KAJOVO_API_ADMIN_EMAIL }}
          VERIFY_ADMIN_PASSWORD: ${{ env.KAJOVO_API_ADMIN_PASSWORD }}
          VERIFY_DEPLOY_SHA: ${{ env.DEPLOY_SHA }}

      - name: Verify live admin login with GitHub credentials
        env:
          VERIFY_BASE_URL: ${{ env.DEPLOY_BASE_URL }}
          VERIFY_ADMIN_EMAIL: ${{ env.KAJOVO_API_ADMIN_EMAIL != '' && env.KAJOVO_API_ADMIN_EMAIL || env.HOTEL_ADMIN_EMAIL }}
          VERIFY_ADMIN_PASSWORD: ${{ env.KAJOVO_API_ADMIN_PASSWORD != '' && env.KAJOVO_API_ADMIN_PASSWORD || env.HOTEL_ADMIN_PASSWORD }}
        run: node scripts/verify_live_admin_login.mjs

      - name: Verify live admin user-management smoke
        env:
          VERIFY_BASE_URL: ${{ env.DEPLOY_BASE_URL }}
          VERIFY_ADMIN_EMAIL: ${{ env.KAJOVO_API_ADMIN_EMAIL != '' && env.KAJOVO_API_ADMIN_EMAIL || env.HOTEL_ADMIN_EMAIL }}
          VERIFY_ADMIN_PASSWORD: ${{ env.KAJOVO_API_ADMIN_PASSWORD != '' && env.KAJOVO_API_ADMIN_PASSWORD || env.HOTEL_ADMIN_PASSWORD }}
          VERIFY_DEPLOY_SHA: ${{ env.DEPLOY_SHA }}
        run: node scripts/verify_live_admin_users_smoke.mjs

      - name: Dump API logs after failed live users smoke
        if: failure()
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.HOTEL_DEPLOY_HOST }}
          username: ${{ env.HOTEL_DEPLOY_USER }}
          password: ${{ env.HOTEL_DEPLOY_PASS }}
          key: ${{ env.HOTEL_DEPLOY_KEY }}
          port: ${{ env.HOTEL_DEPLOY_PORT }}
          script: |
            set -euo pipefail
            cd /opt/kajovo-hotel-monorepo
            export COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME:-kajovo-prod}
            docker compose -f infra/compose.prod.yml -f infra/compose.prod.hotel-hcasc.yml logs api --tail=200 || true

      - name: Upload deploy runtime artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: deploy-runtime-artifact
          path: artifacts/latest.json
          if-no-files-found: ignore
