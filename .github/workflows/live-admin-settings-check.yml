name: Live Admin Settings Check

on:
  workflow_dispatch:
    inputs:
      run_smtp_test:
        description: "Run live SMTP test-email request"
        required: true
        type: boolean
        default: true
      smtp_test_recipient:
        description: "Recipient for SMTP test email (defaults to admin email when empty)"
        required: false
        type: string
        default: ""

permissions: {}

jobs:
  verify-live-settings:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      VERIFY_BASE_URL: https://hotel.hcasc.cz
      HOTEL_ADMIN_EMAIL: ${{ secrets.HOTEL_ADMIN_EMAIL != '' && secrets.HOTEL_ADMIN_EMAIL || vars.HOTEL_ADMIN_EMAIL }}
      HOTEL_ADMIN_PASSWORD: ${{ secrets.HOTEL_ADMIN_PASSWORD != '' && secrets.HOTEL_ADMIN_PASSWORD || vars.HOTEL_ADMIN_PASSWORD }}
      KAJOVO_API_ADMIN_EMAIL: ${{ secrets.KAJOVO_API_ADMIN_EMAIL != '' && secrets.KAJOVO_API_ADMIN_EMAIL || vars.KAJOVO_API_ADMIN_EMAIL || secrets.HOTEL_ADMIN_EMAIL || vars.HOTEL_ADMIN_EMAIL }}
      KAJOVO_API_ADMIN_PASSWORD: ${{ secrets.KAJOVO_API_ADMIN_PASSWORD != '' && secrets.KAJOVO_API_ADMIN_PASSWORD || vars.KAJOVO_API_ADMIN_PASSWORD || secrets.HOTEL_ADMIN_PASSWORD || vars.HOTEL_ADMIN_PASSWORD }}
      VERIFY_ADMIN_EMAIL: ${{ secrets.KAJOVO_API_ADMIN_EMAIL != '' && secrets.KAJOVO_API_ADMIN_EMAIL || vars.KAJOVO_API_ADMIN_EMAIL || secrets.HOTEL_ADMIN_EMAIL || vars.HOTEL_ADMIN_EMAIL }}
      VERIFY_ADMIN_PASSWORD: ${{ secrets.KAJOVO_API_ADMIN_PASSWORD != '' && secrets.KAJOVO_API_ADMIN_PASSWORD || vars.KAJOVO_API_ADMIN_PASSWORD || secrets.HOTEL_ADMIN_PASSWORD || vars.HOTEL_ADMIN_PASSWORD }}
      BETTER_HOTEL_BASE_URL: ${{ secrets.BETTER_HOTEL_BASE_URL != '' && secrets.BETTER_HOTEL_BASE_URL || secrets.KAJOVO_API_BETTER_HOTEL_BASE_URL != '' && secrets.KAJOVO_API_BETTER_HOTEL_BASE_URL || vars.BETTER_HOTEL_BASE_URL || vars.KAJOVO_API_BETTER_HOTEL_BASE_URL }}
      BETTER_HOTEL_LOGIN_PATH: ${{ secrets.BETTER_HOTEL_LOGIN_PATH != '' && secrets.BETTER_HOTEL_LOGIN_PATH || secrets.KAJOVO_API_BETTER_HOTEL_LOGIN_PATH != '' && secrets.KAJOVO_API_BETTER_HOTEL_LOGIN_PATH || vars.BETTER_HOTEL_LOGIN_PATH || vars.KAJOVO_API_BETTER_HOTEL_LOGIN_PATH || '/login' }}
      BETTER_HOTEL_REPORT_URL_TEMPLATE: ${{ secrets.BETTER_HOTEL_REPORT_URL_TEMPLATE != '' && secrets.BETTER_HOTEL_REPORT_URL_TEMPLATE || secrets.KAJOVO_API_BETTER_HOTEL_REPORT_URL_TEMPLATE != '' && secrets.KAJOVO_API_BETTER_HOTEL_REPORT_URL_TEMPLATE || vars.BETTER_HOTEL_REPORT_URL_TEMPLATE || vars.KAJOVO_API_BETTER_HOTEL_REPORT_URL_TEMPLATE }}
      bb_user: ${{ secrets.bb_user != '' && secrets.bb_user || secrets.KAJOVO_API_BETTER_HOTEL_USERNAME != '' && secrets.KAJOVO_API_BETTER_HOTEL_USERNAME || vars.bb_user || vars.KAJOVO_API_BETTER_HOTEL_USERNAME }}
      bb_pass: ${{ secrets.bb_pass != '' && secrets.bb_pass || secrets.KAJOVO_API_BETTER_HOTEL_PASSWORD != '' && secrets.KAJOVO_API_BETTER_HOTEL_PASSWORD || vars.bb_pass || vars.KAJOVO_API_BETTER_HOTEL_PASSWORD }}
      VERIFY_RUN_SMTP_TEST: ${{ inputs.run_smtp_test }}
      VERIFY_SMTP_TEST_RECIPIENT: ${{ inputs.smtp_test_recipient }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Validate admin credential environment
        run: python scripts/check_admin_credentials_env.py

      - name: Validate Better Hotel credential environment
        run: python scripts/check_better_hotel_credentials_env.py

      - name: Verify live admin SMTP settings
        run: node scripts/verify_live_admin_settings.mjs
