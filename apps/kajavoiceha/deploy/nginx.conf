map $server_addr $kajavoiceha_public_address {
    default 0;
    89.221.222.92 1;
    2a02:2b88:2:b5c::1 1;
}

log_format kajavoiceha_safe '$remote_addr [$time_local] $request_method $uri $status $body_bytes_sent';

server {
    listen 80;
    listen [::]:80;
    server_name apimcpkajavoiceha.hcasc.cz;
    access_log /var/log/nginx/kajavoiceha.access.log kajavoiceha_safe;
    error_log /var/log/nginx/kajavoiceha.error.log warn;
    if ($kajavoiceha_public_address = 0) { return 403; }
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/kajavoiceha-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 404; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name apimcpkajavoiceha.hcasc.cz;
    ssl_certificate /etc/letsencrypt/live/apimcpkajavoiceha.hcasc.cz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apimcpkajavoiceha.hcasc.cz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-store" always;
    access_log /var/log/nginx/kajavoiceha.access.log kajavoiceha_safe;
    error_log /var/log/nginx/kajavoiceha.error.log warn;
    client_max_body_size 256k;
    client_body_buffer_size 256k;
    if ($kajavoiceha_public_address = 0) { return 403; }
    if ($host != apimcpkajavoiceha.hcasc.cz) { return 421; }

    location = /mcp {
        proxy_pass http://unix:/run/kajavoiceha/mcp.sock:;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
        proxy_cache off;
        proxy_store off;
        proxy_read_timeout 90s;
        proxy_send_timeout 30s;
        proxy_connect_timeout 5s;
    }
    location = /healthz {
        proxy_pass http://unix:/run/kajavoiceha/mcp.sock:;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
    }
    location / { return 404; }
}
