server {
  listen 80;
  server_name _;
  access_log off;
  absolute_redirect off;
  root /usr/share/nginx/html;
  add_header Cache-Control "no-store" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

  location = /healthz {
    default_type text/plain;
    return 200 'ok';
  }

  location /api/ {
    proxy_pass http://api:8000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /service-worker.js {
    default_type application/javascript;
    alias /usr/share/nginx/html/cml-retire-worker.js;
  }

  location = /hlasovy-chat { return 302 "https://kajovocml.hcasc.cz/#account-voice"; }
  location = /login { return 302 "https://kajovocml.hcasc.cz/"; }
  location /assets/ { try_files $uri =404; }
  location /brand/ { try_files $uri =404; }
  location / { return 302 "https://kajovocml.hcasc.cz/#hotel"; }
}
