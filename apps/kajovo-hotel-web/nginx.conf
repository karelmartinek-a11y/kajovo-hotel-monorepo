server {
  listen 80;
  server_name _;
  access_log off;
  root /usr/share/nginx/html;
  add_header Cache-Control "no-store" always;

  location = /healthz {
    default_type text/plain;
    return 200 'ok';
  }

  # Native Android/API contracts stay independent of the retired browser entry.
  location /api/ {
    proxy_pass http://api:8000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /service-worker.js {
    default_type application/javascript;
    alias /usr/share/nginx/html/cml-retire-worker.js;
  }

  location = /downloads/kajovo-hotel-android.apk {
    default_type application/vnd.android.package-archive;
    try_files $uri =404;
  }

  location /assets/ { return 410; }
  location /static/ { return 410; }
  location /brand/ { return 410; }
  location = /site.webmanifest { return 410; }

  location / {
    return 302 "https://kajovocml.hcasc.cz/#hotel";
  }
}
