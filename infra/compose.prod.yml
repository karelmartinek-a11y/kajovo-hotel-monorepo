x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    logging: *bounded-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kajovo_hotel}
      POSTGRES_USER: ${POSTGRES_USER:-kajovo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kajovo_dev_password}
      POSTGRES_HOST_AUTH_METHOD: ${POSTGRES_HOST_AUTH_METHOD:-}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kajovo} -d ${POSTGRES_DB:-kajovo_hotel}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      kajovo_net:
        aliases:
          - kajovo_postgres

  api:
    build:
      context: ..
      dockerfile: apps/kajovo-hotel-api/Dockerfile
    restart: unless-stopped
    logging: *bounded-logging
    volumes:
      - api_data:/app/data
    environment:
      KAJOVO_API_VOICE_RELEASE_SHA: ${DEPLOY_SOURCE_SHA:-unknown}
      VOICE_MEMORY_CONTEXT_MAX_TOKENS: ${VOICE_MEMORY_CONTEXT_MAX_TOKENS:-2000}
      KAJOVO_API_VOICE_MEMORY_CURATOR_MODEL: ${KAJOVO_API_VOICE_MEMORY_CURATOR_MODEL:-gpt-4.1-mini-2025-04-14}
      KAJOVO_API_VOICE_MEMORY_BATCH_SECONDS: ${KAJOVO_API_VOICE_MEMORY_BATCH_SECONDS:-90}
      KAJOVO_API_VOICE_MEMORY_MAX_CALLS_PER_HOUR: ${KAJOVO_API_VOICE_MEMORY_MAX_CALLS_PER_HOUR:-40}
      KAJOVO_API_VOICE_MASTER_KEY: ${KAJOVO_API_VOICE_MASTER_KEY:-}
      KAJAVOICEHA_MCP_TOKEN: ${KAJAVOICEHA_MCP_TOKEN:-}
      KAJOVO_API_APP_NAME: ${KAJOVO_API_APP_NAME:-Kájovo Hotel API}
      KAJOVO_API_APP_VERSION: ${KAJOVO_API_APP_VERSION:-0.1.0}
      KAJOVO_API_ENVIRONMENT: ${KAJOVO_API_ENVIRONMENT:-production}
      KAJOVO_API_DATABASE_URL: ${KAJOVO_API_DATABASE_URL:-postgresql+psycopg://kajovo:kajovo_dev_password@postgres:5432/kajovo_hotel}
      KAJOVO_API_ADMIN_EMAIL: ${KAJOVO_API_ADMIN_EMAIL:-}
      KAJOVO_API_ADMIN_PASSWORD: ${KAJOVO_API_ADMIN_PASSWORD:-}
      HOTEL_ADMIN_EMAIL: ${HOTEL_ADMIN_EMAIL:-}
      HOTEL_ADMIN_PASSWORD: ${HOTEL_ADMIN_PASSWORD:-}
      BETTER_HOTEL_CONNECTOR_BASE_URL: ${BETTER_HOTEL_CONNECTOR_BASE_URL:-https://api.better-hotel.com/api/connector/v/1}
      BETTER_HOTEL_ACCESS_TOKEN: ${BETTER_HOTEL_ACCESS_TOKEN:-}
      BETTER_HOTEL_CLIENT_TOKEN: ${BETTER_HOTEL_CLIENT_TOKEN:-}
      KAJOVO_API_SMTP_ENABLED: ${KAJOVO_API_SMTP_ENABLED:-false}
      KAJOVO_API_SMTP_FROM_EMAIL: ${KAJOVO_API_SMTP_FROM_EMAIL:-noreply@kajovohotel.local}
      KAJOVO_API_SMTP_ENCRYPTION_KEY: ${KAJOVO_API_SMTP_ENCRYPTION_KEY:-dev-only-smtp-key-change-in-production}
      KAJOVO_API_WEB_PUSH_VAPID_PUBLIC_KEY: ${KAJOVO_API_WEB_PUSH_VAPID_PUBLIC_KEY:-}
      KAJOVO_API_WEB_PUSH_VAPID_PRIVATE_KEY: ${KAJOVO_API_WEB_PUSH_VAPID_PRIVATE_KEY:-}
      KAJOVO_API_WEB_PUSH_VAPID_SUBJECT: ${KAJOVO_API_WEB_PUSH_VAPID_SUBJECT:-mailto:admin@hotel.hcasc.cz}
      KAJOVO_API_FIREBASE_SERVICE_ACCOUNT_JSON_B64: ${KAJOVO_API_FIREBASE_SERVICE_ACCOUNT_JSON_B64:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - kajovo_net

  web:
    build:
      context: ..
      dockerfile: apps/kajovo-hotel-web/Dockerfile
    restart: unless-stopped
    logging: *bounded-logging
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/healthz >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - kajovo_net

  admin:
    build:
      context: ..
      dockerfile: apps/kajovo-hotel-admin/Dockerfile
    restart: unless-stopped
    logging: *bounded-logging
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${ADMIN_PORT:-8083}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/healthz >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - kajovo_net

networks:
  kajovo_net:
    driver: bridge

volumes:
  api_data:
  postgres_data:
