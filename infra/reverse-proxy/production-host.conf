# hotel.hcasc.cz - host-level Nginx vhost
# Canonical domain: hotel.hcasc.cz
# Produkcni server po DNS cutoveru: 89.221.222.92
# Reverse proxy to HOTEL backend published on loopback: 127.0.0.1:8202
# Media must NOT be publicly accessible without admin session.

# NOTE: This file is intended for /etc/nginx/sites-available/hotel.hcasc.cz.conf
# and symlinked into /etc/nginx/sites-enabled/.

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

map $http_user_agent $is_mobile_ua {
    default 0;
    ~*(Android|iPhone|iPad|Mobile|Tablet) 1;
}

server {
    if ($host = hotel.hcasc.cz) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;

    server_name hotel.hcasc.cz;

    access_log /var/log/hotelapp/nginx_access.log;
    error_log  /var/log/hotelapp/nginx_error.log;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/hotelapp/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name hotel.hcasc.cz;

    access_log /var/log/hotelapp/nginx_access.log;
    error_log  /var/log/hotelapp/nginx_error.log;

    ssl_certificate /etc/letsencrypt/live/hotel.hcasc.cz-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hotel.hcasc.cz-0001/privkey.pem;

    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    client_max_body_size 25m;
    autoindex off;

    location = /sw.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        return 410;
    }

    location = /service-worker.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        return 410;
    }

    location = /admin/sw.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        return 410;
    }

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location = /backend-health {
        proxy_pass http://127.0.0.1:8202/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    location = /ready {
        proxy_pass http://127.0.0.1:8202/ready;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8080/healthz;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    location ^~ /static/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8202;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_redirect off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location = /admin {
        return 301 /admin/login;
    }

    location ~* ^/admin(?<admin_suffix>/.*)?$ {
        return 301 /admin$admin_suffix$is_args$args;
    }

    location ^~ /admin/ {
        proxy_pass http://127.0.0.1:8083/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
