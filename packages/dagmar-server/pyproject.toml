[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dagmar-server"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2,<3", "cryptography>=43", "fastapi>=0.115", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]
