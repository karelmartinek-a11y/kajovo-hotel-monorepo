[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dagmar-server"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["voice-core-server==0.1.0", "pydantic>=2,<3", "cryptography>=43", "fastapi>=0.115", "httpx>=0.27,<1", "mcp==1.30.0", "jsonschema==4.26.0", "sqlalchemy>=2.0.44,<3", "tiktoken>=0.12,<1", "websockets>=15,<16"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dagmar_server = ["*.json"]
